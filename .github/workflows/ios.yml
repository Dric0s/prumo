name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      destino:
        description: Para onde vai o build assinado
        type: choice
        options: [testflight, adhoc, nenhum]
        default: testflight

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor-linux:
    name: PrumoKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libsqlite3-dev
      - run: swift test
        working-directory: PrumoKit

  app-macos:
    name: App e widget (simulador)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # A App Store Connect exige o SDK do Xcode 26 ou posterior.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Testes do motor
        run: swift test
        working-directory: PrumoKit
      - name: Gerar projeto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compilar para o simulador (sem assinatura)
        run: |
          xcodebuild build \
            -project Prumo.xcodeproj \
            -scheme Prumo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # Só em disparo manual ou tag v*: nunca em pull request, para os segredos não chegarem a forks.
  # Tag v* envia ao TestFlight; o disparo manual escolhe entre TestFlight e Ad Hoc.
  assinado:
    name: Build assinado (${{ inputs.destino || 'testflight' }})
    if: (github.event_name == 'workflow_dispatch' && inputs.destino != 'nenhum') || startsWith(github.ref, 'refs/tags/v')
    needs: [motor-linux, app-macos]
    runs-on: macos-26
    env:
      DESTINO: ${{ inputs.destino || 'testflight' }}
      IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
      IOS_DIST_KEY_BASE64: ${{ secrets.IOS_DIST_KEY_BASE64 }}
      IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
      IOS_PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
      IOS_PROFILE_APP_STORE_BASE64: ${{ secrets.IOS_PROFILE_APP_STORE_BASE64 }}
      IOS_PROFILE_WIDGET_STORE_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_STORE_BASE64 }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Escolher perfis e número do build
        run: |
          if [ "$DESTINO" = testflight ]; then
            echo "PERFIL_APP=Prumo app connect"       >> "$GITHUB_ENV"
            echo "PERFIL_WIDGET=Prumo widget connect" >> "$GITHUB_ENV"
            echo "EXPORT_OPTIONS=ci/ExportOptions-AppStore.plist" >> "$GITHUB_ENV"
            obrigatorios="IOS_PROFILE_APP_STORE_BASE64 IOS_PROFILE_WIDGET_STORE_BASE64 ASC_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID"
          else
            echo "PERFIL_APP=Prumo app"       >> "$GITHUB_ENV"
            echo "PERFIL_WIDGET=Prumo Widget" >> "$GITHUB_ENV"
            echo "EXPORT_OPTIONS=ci/ExportOptions-AdHoc.plist" >> "$GITHUB_ENV"
            obrigatorios="IOS_PROFILE_APP_BASE64 IOS_PROFILE_WIDGET_BASE64"
          fi
          for v in IOS_DIST_CERT_BASE64 IOS_DIST_KEY_BASE64 $obrigatorios; do
            if [ -z "${!v}" ]; then
              echo "::error::Segredo $v ausente. Rode scripts/configurar-assinatura.sh."
              exit 1
            fi
          done
          # Único e crescente, inclusive ao reexecutar o mesmo run.
          echo "BUILD=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"

      - name: Instalar certificado num keychain temporário
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          KC="$RUNNER_TEMP/prumo.keychain-db"
          KC_SENHA="$(openssl rand -hex 24)"
          P12_SENHA="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_SENHA"
          echo "::add-mask::$P12_SENHA"

          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > dist.cer
          echo "$IOS_DIST_KEY_BASE64"  | base64 --decode > dist.key
          # O LibreSSL do sistema gera um .p12 que o `security` do macOS importa sem erro de MAC.
          /usr/bin/openssl x509 -inform der -in dist.cer -out dist.pem
          /usr/bin/openssl pkcs12 -export -inkey dist.key -in dist.pem -out dist.p12 -passout "pass:$P12_SENHA"
          rm -f dist.key

          curl -fsSL -o wwdr.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

          security create-keychain -p "$KC_SENHA" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_SENHA" "$KC"
          security import wwdr.cer -k "$KC" -T /usr/bin/codesign
          security import dist.p12 -k "$KC" -P "$P12_SENHA" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_SENHA" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          rm -f dist.p12
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Instalar perfis de provisionamento
        run: |
          set -euo pipefail
          for var in IOS_PROFILE_APP_BASE64 IOS_PROFILE_WIDGET_BASE64 IOS_PROFILE_APP_STORE_BASE64 IOS_PROFILE_WIDGET_STORE_BASE64; do
            [ -n "${!var}" ] || continue
            f="$RUNNER_TEMP/$var.mobileprovision"
            echo "${!var}" | base64 --decode > "$f"
            security cms -D -i "$f" > "$RUNNER_TEMP/$var.plist"
            uuid="$(plutil -extract UUID raw -o - "$RUNNER_TEMP/$var.plist")"
            echo "$var: $(plutil -extract Name raw -o - "$RUNNER_TEMP/$var.plist") ($uuid)"
            if ! grep -q "group.br.prumo.app" "$RUNNER_TEMP/$var.plist"; then
              echo "::error::O perfil $var não inclui o App Group group.br.prumo.app."
              exit 1
            fi
            for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$d"
              cp "$f" "$d/$uuid.mobileprovision"
            done
          done

      - name: Gerar projeto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Arquivar
        run: |
          xcodebuild archive \
            -project Prumo.xcodeproj \
            -scheme Prumo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Prumo.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            PRUMO_PERFIL_APP="$PERFIL_APP" \
            PRUMO_PERFIL_WIDGET="$PERFIL_WIDGET" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Exportar IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Prumo.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Enviar ao TestFlight
        if: env.DESTINO == 'testflight'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "Build $BUILD enviado. O processamento no App Store Connect leva alguns minutos." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Prumo-${{ env.DESTINO }}-${{ env.BUILD }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Limpar keychain, perfis e chave da API
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          rm -f "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.plist "$RUNNER_TEMP"/dist.*
